# Daily, pins the ANGLE commit Chrome stable ships (angle/scripts/bump.py) and
# opens a pull request for it from the `angle-bump` branch, as the oxgl-js
# GitHub App so that angle-build runs on it, with auto-merge on: the merge
# queue builds and smoke-tests the bundles and lands it, and the push to main
# releases them. An open bump is rebuilt only when the pin it would make
# changes (Chrome stable moved, or main's bundle_version or pin.toml moved), so
# a bump building in the queue isn't pulled out; it's closed when main needs no
# bump. A bump carrying a fix pushed to its branch is left alone, and lands
# through the queue once its checks pass. A closed bump labelled skip-bump
# skips its ANGLE commit.
name: angle-bump

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: angle-bump

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, to compare an open bump with this one.
          fetch-depth: 0
          persist-credentials: false
      # The App's token, so the pull request starts CI and can enter the queue.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot
        with:
          client-id: ${{ secrets.OXGL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OXGL_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Pin Chrome stable's ANGLE and open or refresh the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          out="$(python3 angle/scripts/bump.py)"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head angle-bump --state open --json number --jq length)"
          if [ -z "$out" ]; then
            if [ "$open" != 0 ] && angle/scripts/pin_only.sh HEAD origin/angle-bump; then
              gh pr close angle-bump --repo "$GITHUB_REPOSITORY" --comment "main needs no bump for Chrome stable's ANGLE commit."
            fi
            exit 0
          fi
          tag="${out% *}" chrome="${out#* }"
          python3 angle/scripts/check_pin.py
          commit="$(angle/scripts/pin.sh angle_commit)"
          skipped="$(gh pr list --repo "$GITHUB_REPOSITORY" --head angle-bump --state closed --label skip-bump --limit 100 --json body \
            | jq --arg commit "$commit" '[.[] | select(.body | contains($commit))] | length')"
          if [ "$skipped" != 0 ]; then
            echo "A bump to ANGLE $commit is labelled skip-bump; remove the label to retry"
            exit 0
          fi
          # Leave a fix pushed to the branch alone, and this exact bump too.
          if [ "$open" != 0 ] && { ! angle/scripts/pin_only.sh HEAD origin/angle-bump \
            || git diff --quiet origin/angle-bump -- angle/pin.toml; }; then
            echo "The open bump pull request is current or carries a fix"
            exit 0
          fi
          title="Pin Chrome $chrome's ANGLE ($tag)"
          body="ANGLE $commit from $(angle/scripts/pin.sh chromium_branch), the commit Chrome $chrome's DEPS pins. It lands through the merge queue once its checks pass, which builds and smoke-tests the bundles; the push to main releases them. To skip this ANGLE commit, label this skip-bump and close it."
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title" angle/pin.toml
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/angle-bump
          if [ "$open" != 0 ]; then
            gh pr edit angle-bump --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head angle-bump --title "$title" --body "$body"
          fi
          # The merge queue sets the merge method (squash).
          gh pr merge angle-bump --repo "$GITHUB_REPOSITORY" --auto
