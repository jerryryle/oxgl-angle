# Daily, pins the ANGLE commit Chrome stable ships (angle/scripts/bump.py),
# opens a pull request for it from the `angle-bump` branch and runs angle-build
# on that branch. Pushes and pull requests made with the default token trigger
# no workflows, but a workflow_dispatch does, and its `angle-build` check lands
# on the pull request's head commit. When it passes, angle-build's merge-bump
# job merges the pull request and runs angle-build on main, which publishes the
# release. An open bump is refreshed when main or Chrome stable moves on, and
# closed when main needs no bump, unless it carries a fix pushed to its branch; a
# bump that fails (a patch that no longer applies, say) stays open for that fix,
# which a person merges. A closed bump labelled skip-bump skips its ANGLE commit.
name: angle-bump

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: angle-bump

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, to compare an open bump with this one.
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Chrome stable's ANGLE and open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$(python3 angle/scripts/bump.py)"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head angle-bump --state open --json number --jq length)"
          if [ -z "$out" ]; then
            if [ "$open" != 0 ] && angle/scripts/pin_only.sh HEAD origin/angle-bump; then
              gh pr close angle-bump --repo "$GITHUB_REPOSITORY" --comment "main needs no bump for Chrome stable's ANGLE commit."
            fi
            exit 0
          fi
          tag="${out% *}" chrome="${out#* }"
          python3 angle/scripts/check_pin.py
          commit="$(angle/scripts/pin.sh angle_commit)"
          skipped="$(gh pr list --repo "$GITHUB_REPOSITORY" --head angle-bump --state closed --label skip-bump --limit 100 --json body \
            | jq --arg commit "$commit" '[.[] | select(.body | contains($commit))] | length')"
          if [ "$skipped" != 0 ]; then
            echo "A bump to ANGLE $commit is labelled skip-bump; remove the label to retry"
            exit 0
          fi
          # Leave a fix pushed to the branch alone, and this exact bump too.
          if [ "$open" != 0 ] && { ! angle/scripts/pin_only.sh HEAD origin/angle-bump \
            || git diff --quiet origin/angle-bump -- angle/pin.toml; }; then
            echo "The open bump pull request is current or carries a fix"
            exit 0
          fi
          title="Pin Chrome $chrome's ANGLE ($tag)"
          body="ANGLE $commit from $(angle/scripts/pin.sh chromium_branch), the commit Chrome $chrome's DEPS pins. angle-build merges this when it passes, unless someone pushes to this branch: merge such a fix by hand. To skip this ANGLE commit, label this skip-bump and close it."
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title" angle/pin.toml
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/angle-bump
          if [ "$open" != 0 ]; then
            gh pr edit angle-bump --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head angle-bump --title "$title" --body "$body"
          fi
          gh workflow run angle-build.yml --repo "$GITHUB_REPOSITORY" --ref angle-bump
