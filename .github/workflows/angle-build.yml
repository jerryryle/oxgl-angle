# Builds the oxgl ANGLE bundles from the recipe in angle/ (pin.toml, GN args,
# source patches, scripts, license data). Runs on every pull request and reports
# one aggregate check, `angle-build`, which branch protection requires. A pull
# request that changes the recipe builds, checks and smoke-tests all five
# platforms and keeps the bundles as run artifacts; one that changes only this
# workflow does the same without needing a new bundle_version; any other pull
# request skips the builds. The arm64 Linux and Windows bundles are
# cross-compiled on x64 runners and smoke-tested on arm64 runners in the smoke
# job. A push to main that changes the recipe (a merged pull request) builds
# and smoke-tests again and publishes the release; a manual run
# (workflow_dispatch) from main does the same for an unreleased bundle_version,
# such as after a failed release run. Copy the printed digests into oxgl's
# angle/bundles.toml (see angle/README.md). A green manual run on
# angle-bump.yml's `angle-bump` branch merges its pull request and runs this on
# main (the merge-bump job). Published bundle versions are never rebuilt or
# replaced.
name: angle-build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run; runs on main are never
# cancelled, so every merged recipe change gets its release.
concurrency:
  group: angle-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Workflow linters, pinned to oxgl's versions. Dependabot doesn't bump these.
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.31.1"

jobs:
  # Which kind of change this is. recipe: a file that builds or tests a bundle
  # changed (it needs a new bundle_version). build: the recipe or this workflow
  # changed (the bundles are built and smoke-tested). Same script as oxgl's
  # ci.yml `changes` job, also run on the commits a push to main adds, where
  # only a recipe change builds (its pull request already built a workflow
  # change, and there is nothing to release); when the changed files can't be
  # determined (a manual run, or the diff fails), both are true.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      recipe: ${{ steps.match.outputs.recipe }}
      build: ${{ steps.match.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          recipe=true build=true
          # --no-renames lists both sides of a rename, so moving a recipe file
          # away still counts as changing it.
          if [ "$EVENT" != workflow_dispatch ] && files="$(git diff --no-renames --name-only "$BASE...$HEAD")" && [ -n "$files" ]; then
            recipe=false build=false
            while IFS= read -r f; do
              case "$f" in
                angle/pin.toml|angle/args/*|angle/patches/*|angle/build.sh|angle/build.ps1|angle/scripts/bundle.py|angle/scripts/pin.sh|angle/smoke/*|angle/licenses.toml|angle/license-texts/*)
                  recipe=true build=true ;;
                .github/workflows/angle-build.yml)
                  build=true ;;
              esac
            done <<< "$files"
            [ "$EVENT" = push ] && build="$recipe"
          fi
          { echo "recipe=$recipe"; echo "build=$build"; } | tee -a "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database verifies the module download.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
          fallback: none
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows
      - run: python3 angle/scripts/check_pin.py

  guard:
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    # A recipe change needs a new bundle_version; fail in seconds, not after
    # the compile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse an already released bundle_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(angle/scripts/pin.sh bundle_version)"
          # Only a 404 means unreleased; any other failure (auth, rate limit,
          # network) must not let a forgotten bump through.
          status="$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null | head -n1 || true)"
          case "$status" in
            *" 404"*) ;;
            *" 200"*) echo "::error::$tag is already released; bump bundle_version in angle/pin.toml"; exit 1 ;;
            *) echo "::error::could not check whether $tag is released (${status:-no response})"; exit 1 ;;
          esac

  build:
    # Runs on a workflow-only change too, when guard is skipped.
    needs: [changes, guard]
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' && contains(fromJSON('["success","skipped"]'), needs.guard.result) }}
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # native: the runner can execute the bundle, so the smoke test runs here;
        # cross-compiled bundles are smoke-tested by the smoke job instead.
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            native: true
          - platform: linux-arm64
            runner: ubuntu-24.04
            native: false
          - platform: macos-arm64
            runner: macos-15
            native: true
          - platform: windows-x64
            runner: windows-2025
            native: true
          - platform: windows-arm64
            runner: windows-2025
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Use the large disk for the ANGLE checkout (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/angle-build
          sudo chown "$USER" /mnt/angle-build
          echo "OXGL_ANGLE_WORK=/mnt/angle-build" >> "$GITHUB_ENV"
      - name: Cross binutils (linux-arm64)
        if: matrix.platform == 'linux-arm64'
        # bundle.py strips and inspects the arm64 libraries with these.
        run: sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
      - name: Work directory and Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OXGL_ANGLE_WORK=$RUNNER_TEMP/angle-build" >> "$GITHUB_ENV"
          # ANGLE compiles its Metal shaders with `metal`, an optional Xcode component.
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Work directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OXGL_ANGLE_WORK=D:\angle-build" | Out-File -Append $env:GITHUB_ENV'

      - name: Build bundle (Linux, macOS)
        if: runner.os != 'Windows'
        run: angle/build.sh all ${{ matrix.platform }}
      - name: Fetch ANGLE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: angle/build.ps1 fetch
      - name: Install the Windows SDK the pinned Chromium build requires
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chromium pins an exact SDK (SDK_VERSION in build/vs_toolchain.py), which
          # the runner image may not ship; add it as a Visual Studio component.
          $toolchain = Get-Content "$env:OXGL_ANGLE_WORK\angle\build\vs_toolchain.py" -Raw
          $sdk = [regex]::Match($toolchain, "SDK_VERSION = '([0-9.]+)'").Groups[1].Value
          if (-not $sdk) { throw 'SDK_VERSION not found in build/vs_toolchain.py' }
          $include = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$sdk\um"
          if (Test-Path $include) { "Windows SDK $sdk already installed"; exit 0 }
          $component = "Microsoft.VisualStudio.Component.Windows11SDK.$($sdk.Split('.')[2])"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          "Installing $component into $vs"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--add', $component, '--quiet', '--norestart', '--nocache')
          if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path $include)) { throw "Windows SDK $sdk headers not found after install: $include" }
      - name: Install the Visual Studio ARM64 build tools (windows-arm64)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $found = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($found) { 'VS ARM64 build tools already installed'; exit 0 }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--quiet', '--norestart', '--nocache')
          if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
      - name: Build bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          angle/build.ps1 build ${{ matrix.platform }}
          angle/build.ps1 bundle ${{ matrix.platform }}

      - name: Smoke test (Linux, macOS)
        if: runner.os != 'Windows' && matrix.native
        run: |
          dist="$OXGL_ANGLE_WORK/dist/angle-${{ matrix.platform }}"
          cc -O2 -I"$dist/include" angle/smoke/smoke.c -o smoke -ldl
          env -u DISPLAY -u WAYLAND_DISPLAY ./smoke "$dist/lib"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows' && matrix.native
        shell: pwsh
        run: |
          $dist = "$env:OXGL_ANGLE_WORK\dist\angle-windows-x64"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /I`"$dist\include`" angle\smoke\smoke.c /Fe:smoke.exe"
          if ($LASTEXITCODE) { throw 'smoke build failed' }
          .\smoke.exe "$dist\lib"
          if ($LASTEXITCODE) { throw 'smoke test failed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: angle-${{ matrix.platform }}
          path: |
            ${{ env.OXGL_ANGLE_WORK }}/dist/angle-${{ matrix.platform }}.tar.xz
            ${{ env.OXGL_ANGLE_WORK }}/dist/angle-${{ matrix.platform }}-symbols.tar.xz
          if-no-files-found: error

  # Cross-compiled bundles are smoke-tested on a runner of their own
  # architecture, from the artifact the build job uploaded.
  smoke:
    # A job reads only its direct needs, so this can't reuse build's condition.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    name: smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: angle-${{ matrix.platform }}
          path: bundle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Extract bundle
        run: python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" "bundle/angle-${{ matrix.platform }}.tar.xz" dist
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cc -O2 -Idist/include angle/smoke/smoke.c -o smoke -ldl
          env -u DISPLAY -u WAYLAND_DISPLAY ./smoke "$PWD/dist/lib"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsarm64.bat`" && cl /nologo /O2 /Idist\include angle\smoke\smoke.c /Fe:smoke.exe"
          if ($LASTEXITCODE) { throw 'smoke build failed' }
          .\smoke.exe "$PWD\dist\lib"
          if ($LASTEXITCODE) { throw 'smoke test failed' }

  release:
    needs: [changes, build, smoke]
    # Releases come only from main: a push that changed the recipe, or a
    # manual run. Never from a pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.recipe == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true
      - name: Publish release and print digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(angle/scripts/pin.sh bundle_version)"
          commit="$(angle/scripts/pin.sh angle_commit)"
          (cd bundles && sha256sum ./*.tar.xz | tee SHA256SUMS)
          # Published bundles are immutable (rebuilds are not bit-identical), so
          # never upload into an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; bump bundle_version in angle/pin.toml"
            exit 1
          fi
          # Tag the commit whose recipe built these bundles, not the default branch.
          gh release create "$tag" bundles/*.tar.xz bundles/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ANGLE bundle $tag" \
            --notes "ANGLE $commit built by angle/build.sh at ${GITHUB_SHA}. Digests are in SHA256SUMS; copy them into oxgl's angle/bundles.toml."
          {
            echo "### ANGLE bundle digests ($tag)"
            echo '```'
            cat bundles/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check branch protection requires. A job may be skipped only when
  # this change did not need it; any other skip (a broken `if:`, an upstream
  # failure) fails the check.
  angle-build:
    if: always()
    needs: [changes, workflow-lint, guard, build, smoke, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT" --arg ref "$REF" '
            def ok(skippable): .result == "success" or (.result == "skipped" and skippable);
            .changes.outputs as $c
            | (.changes | ok(false)) and (.["workflow-lint"] | ok(false))
              and (.guard | ok($c.recipe == "false"))
              and (.build | ok($c.build == "false"))
              and (.smoke | ok($c.build == "false"))
              and (.release | ok($ref != "refs/heads/main" or ($event == "push" and $c.recipe == "false")))'

  # Merges the green pull request from angle-bump.yml after the run its
  # dispatch started, but only when the branch is exactly the change main's
  # bump.py makes to main's pin.toml for the Chrome version its commit names,
  # which bump.py requires to be a Linux stable release: anything else pushed to
  # angle-bump (a fix, or a bump gone stale because main moved) waits for a
  # person, so nothing reaches a release without review except an ANGLE commit
  # a Chrome stable release pins. The version comes from the commit, not a new
  # lookup of the current stable, so a Chrome release during the build doesn't
  # hold up the merge.
  # --match-head-commit merges only the commit this run tested. A merge with the
  # default token triggers no push run, so this starts the run on main that
  # publishes the release. The explicit status check matters: the implicit
  # success() also looks at the skipped release job and would skip this job.
  merge-bump:
    needs: angle-build
    if: >-
      ${{ !cancelled() && needs.angle-build.result == 'success'
      && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/angle-bump' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the bump pull request and release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Chrome version angle-bump.yml put in its commit subject.
          chrome="$(git log -1 --format=%s HEAD | sed -nE "s/^Pin Chrome ([0-9.]+)'s ANGLE .*/\1/p")"
          if [ -z "$chrome" ]; then
            echo "::notice::angle-bump's head is not angle-bump.yml's commit; merge it by hand"
            exit 0
          fi
          # Rerun main's scripts, not the branch's, on main's pin.
          expected="$RUNNER_TEMP/angle"
          mkdir "$expected"
          git show origin/main:angle/scripts/bump.py > "$RUNNER_TEMP/bump.py"
          git show origin/main:angle/scripts/pin_only.sh > "$RUNNER_TEMP/pin_only.sh"
          git show origin/main:angle/pin.toml > "$expected/pin.toml"
          python3 "$RUNNER_TEMP/bump.py" "$expected" "$chrome" > /dev/null
          if ! bash "$RUNNER_TEMP/pin_only.sh" origin/main HEAD \
            || ! cmp -s "$expected/pin.toml" angle/pin.toml; then
            echo "::notice::angle-bump is not exactly bump.py's change to main; merge it by hand"
            exit 0
          fi
          gh pr merge angle-bump --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$GITHUB_SHA"
          gh workflow run angle-build.yml --repo "$GITHUB_REPOSITORY" --ref main
