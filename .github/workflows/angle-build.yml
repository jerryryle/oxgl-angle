# Builds the oxgl ANGLE bundles from the recipe in angle/ (pin.toml, GN args,
# source patches, scripts, license data) and releases them. Reports one
# aggregate check, `angle-build`, which branch protection and the merge queue
# require. A pull request runs workflow lint and the bundle-version guard; one
# labelled full-ci also builds and smoke-tests (adding the label starts no run;
# push, or run this by hand on the branch). A merge group (the merge queue)
# builds, checks and smoke-tests all five platforms when its changes touch the
# recipe or this workflow, and keeps the bundles as run artifacts; a
# workflow-only change needs no new bundle_version. The arm64 Linux and Windows
# bundles are cross-compiled on x64 runners and smoke-tested on arm64 runners in
# the smoke job. A push to main that changed the recipe builds nothing: it
# releases the bundles the merge group run for that commit built and
# smoke-tested, then starts oxgl's bump. A manual run (workflow_dispatch) builds
# and smoke-tests; on main it also releases an unreleased bundle_version, such
# as after a merge that bypassed the queue. Published bundle versions are never
# rebuilt or replaced.
name: angle-build

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run; merge group runs and
# runs on main are never cancelled, so every merged recipe change gets its
# release.
concurrency:
  group: angle-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Workflow linters, pinned to oxgl's versions. Dependabot doesn't bump these.
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.31.1"

jobs:
  # Which kind of change this is. recipe: a file that builds or tests a bundle
  # changed (it needs a new bundle_version). build: the bundles are built and
  # smoke-tested, for a recipe or workflow change in a merge group, a manual
  # run, or a full-ci pull request. own-recipe: the change's own diff, from the
  # commit it is built on (own-base: a pull request's base, or the parent of a
  # merge group's head, which is the entry queued ahead of it or main), touches
  # the recipe, so the guard compares bundle_versions with own-base. A merge
  # group's recipe and build use the cumulative range from main, so an entry
  # queued behind a recipe change still builds the bundles its push releases. On
  # a push, recipe decides whether the push releases and build is false. When
  # the changed files can't be determined (a manual run, or the diff fails),
  # recipe and build are true.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      recipe: ${{ steps.match.outputs.recipe }}
      build: ${{ steps.match.outputs.build }}
      own-recipe: ${{ steps.match.outputs.own-recipe }}
      own-base: ${{ steps.match.outputs.own-base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          # Prints recipe when a file in the given range is in the recipe, build
          # when one is in the recipe or this workflow, and nothing otherwise;
          # fails when the range can't be listed or is empty. --no-renames lists
          # both sides of a rename, so moving a recipe file away still counts.
          kind() {
            local files f out=
            files="$(git diff --no-renames --name-only "$1")" && [ -n "$files" ] || return 1
            while IFS= read -r f; do
              case "$f" in
                angle/pin.toml|angle/args/*|angle/patches/*|angle/build.sh|angle/build.ps1|angle/scripts/bundle.py|angle/scripts/pin.sh|angle/scripts/skip_deps.py|angle/smoke/*|angle/licenses.toml|angle/license-texts/*)
                  echo recipe; return ;;
                .github/workflows/angle-build.yml) out=build ;;
              esac
            done <<< "$files"
            echo "$out"
          }
          recipe=true build=true own_recipe=true own_base=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" own_base="$PR_BASE" ;;
            merge_group) range="$(git merge-base origin/main "$SHA")..$SHA" own_base="$(git rev-parse "$SHA^")" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range= || range="$BEFORE..$SHA" ;;
            *) range= ;;
          esac
          if [ -n "$range" ] && k="$(kind "$range")"; then
            recipe=false build=false
            [ "$k" = recipe ] && recipe=true build=true
            [ "$k" = build ] && build=true
          fi
          if [ -n "$own_base" ] && k="$(kind "$own_base...$SHA")"; then
            own_recipe=false
            [ "$k" = recipe ] && own_recipe=true
          fi
          # Builds run in the queue, on a manual run, or when a pull request asks.
          case "$EVENT" in
            push) build=false ;;
            pull_request) [ "$FULL_CI" = true ] || build=false ;;
          esac
          { echo "recipe=$recipe"; echo "build=$build"; echo "own-recipe=$own_recipe"; echo "own-base=$own_base"; } | tee -a "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database verifies the module download.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
          fallback: none
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows
      - run: python3 angle/scripts/check_pin.py

  guard:
    needs: changes
    # A push releases what its merge group checked; the release refuses an
    # existing release itself.
    if: needs.changes.outputs.recipe == 'true' && github.event_name != 'push'
    # A recipe change needs a new bundle_version; fail in seconds, not after
    # the compile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse an already released bundle_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(angle/scripts/pin.sh bundle_version)"
          # Only a 404 means unreleased; any other failure (auth, rate limit,
          # network) must not let a forgotten bump through.
          status="$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null | head -n1 || true)"
          case "$status" in
            *" 404"*) ;;
            *" 200"*) echo "::error::$tag is already released; bump bundle_version in angle/pin.toml"; exit 1 ;;
            *) echo "::error::could not check whether $tag is released (${status:-no response})"; exit 1 ;;
          esac
      # Two recipe changes queued back to back are both tested before either
      # releases, so the check above passes for both; requiring a version
      # greater than the commit the change is built on catches the second.
      - name: Require a bundle_version greater than the one this change is built on
        if: needs.changes.outputs.own-recipe == 'true' && needs.changes.outputs.own-base != ''
        env:
          BASE: ${{ needs.changes.outputs.own-base }}
        run: |
          new="$(angle/scripts/pin.sh bundle_version)"
          # Same parse as pin.sh, on the base's pin.toml.
          old="$(git show "$BASE:angle/pin.toml" | sed -n 's/^bundle_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"
          # angle-<branch>.<n>: compare the branch, then n.
          newest="$(printf '%s\n' "${old#angle-}" "${new#angle-}" | sort -t. -k1,1n -k2,2n | tail -n1)"
          if [ -z "$old" ]; then
            echo "::error::could not read bundle_version from angle/pin.toml at $BASE"
            exit 1
          fi
          if [ "$old" = "$new" ] || [ "$newest" != "${new#angle-}" ]; then
            echo "::error::bundle_version $new must be greater than $old, the version at $BASE"
            exit 1
          fi

  build:
    # Runs on a workflow-only change too, when guard is skipped.
    needs: [changes, guard]
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' && contains(fromJSON('["success","skipped"]'), needs.guard.result) }}
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # native: the runner can execute the bundle, so the smoke test runs here;
        # cross-compiled bundles are smoke-tested by the smoke job instead.
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            native: true
          - platform: linux-arm64
            runner: ubuntu-24.04
            native: false
          - platform: macos-arm64
            runner: macos-15
            native: true
          - platform: windows-x64
            runner: windows-2025
            native: true
          - platform: windows-arm64
            runner: windows-2025
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Use the large disk for the ANGLE checkout (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/angle-build
          sudo chown "$USER" /mnt/angle-build
          echo "OXGL_ANGLE_WORK=/mnt/angle-build" >> "$GITHUB_ENV"
      - name: Cross binutils (linux-arm64)
        if: matrix.platform == 'linux-arm64'
        # bundle.py strips and inspects the arm64 libraries with these.
        run: sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
      - name: Work directory and Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OXGL_ANGLE_WORK=$RUNNER_TEMP/angle-build" >> "$GITHUB_ENV"
          # ANGLE compiles its Metal shaders with `metal`, an optional Xcode component.
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Work directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OXGL_ANGLE_WORK=D:\angle-build" | Out-File -Append $env:GITHUB_ENV'

      - name: Build bundle (Linux, macOS)
        if: runner.os != 'Windows'
        run: angle/build.sh all ${{ matrix.platform }}
      - name: Fetch ANGLE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: angle/build.ps1 fetch
      - name: Install the Windows SDK the pinned Chromium build requires
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chromium pins an exact SDK (SDK_VERSION in build/vs_toolchain.py), which
          # the runner image may not ship; add it as a Visual Studio component.
          $toolchain = Get-Content "$env:OXGL_ANGLE_WORK\angle\build\vs_toolchain.py" -Raw
          $sdk = [regex]::Match($toolchain, "SDK_VERSION = '([0-9.]+)'").Groups[1].Value
          if (-not $sdk) { throw 'SDK_VERSION not found in build/vs_toolchain.py' }
          $include = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$sdk\um"
          if (Test-Path $include) { "Windows SDK $sdk already installed"; exit 0 }
          $component = "Microsoft.VisualStudio.Component.Windows11SDK.$($sdk.Split('.')[2])"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          "Installing $component into $vs"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--add', $component, '--quiet', '--norestart', '--nocache')
          if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path $include)) { throw "Windows SDK $sdk headers not found after install: $include" }
      - name: Install the Visual Studio ARM64 build tools (windows-arm64)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $found = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($found) { 'VS ARM64 build tools already installed'; exit 0 }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--quiet', '--norestart', '--nocache')
          if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
      - name: Build bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          angle/build.ps1 build ${{ matrix.platform }}
          angle/build.ps1 bundle ${{ matrix.platform }}

      - name: Smoke test (Linux, macOS)
        if: runner.os != 'Windows' && matrix.native
        run: |
          dist="$OXGL_ANGLE_WORK/dist/angle-${{ matrix.platform }}"
          cc -O2 -I"$dist/include" angle/smoke/smoke.c -o smoke -ldl
          env -u DISPLAY -u WAYLAND_DISPLAY ./smoke "$dist/lib"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows' && matrix.native
        shell: pwsh
        run: |
          $dist = "$env:OXGL_ANGLE_WORK\dist\angle-windows-x64"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /I`"$dist\include`" angle\smoke\smoke.c /Fe:smoke.exe"
          if ($LASTEXITCODE) { throw 'smoke build failed' }
          .\smoke.exe "$dist\lib"
          if ($LASTEXITCODE) { throw 'smoke test failed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: angle-${{ matrix.platform }}
          path: |
            ${{ env.OXGL_ANGLE_WORK }}/dist/angle-${{ matrix.platform }}.tar.xz
            ${{ env.OXGL_ANGLE_WORK }}/dist/angle-${{ matrix.platform }}-symbols.tar.xz
          if-no-files-found: error

  # Cross-compiled bundles are smoke-tested on a runner of their own
  # architecture, from the artifact the build job uploaded.
  smoke:
    # A job reads only its direct needs, so this can't reuse build's condition.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    name: smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: angle-${{ matrix.platform }}
          path: bundle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Extract bundle
        run: python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" "bundle/angle-${{ matrix.platform }}.tar.xz" dist
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cc -O2 -Idist/include angle/smoke/smoke.c -o smoke -ldl
          env -u DISPLAY -u WAYLAND_DISPLAY ./smoke "$PWD/dist/lib"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsarm64.bat`" && cl /nologo /O2 /Idist\include angle\smoke\smoke.c /Fe:smoke.exe"
          if ($LASTEXITCODE) { throw 'smoke build failed' }
          .\smoke.exe "$PWD\dist\lib"
          if ($LASTEXITCODE) { throw 'smoke test failed' }

  release:
    needs: [changes, build, smoke]
    # Releases come only from main: a push that changed the recipe, from its
    # merge group run's bundles, or a manual run, from its own. Never from a
    # pull request or a merge group.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && needs.changes.outputs.recipe == 'true')
          || (github.event_name == 'workflow_dispatch' && needs.smoke.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # To download the merge group run's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the merge group run that built this commit
        id: source
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/angle-build.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$id" ]; then
            echo "::error::no passing merge group run built $GITHUB_SHA (merged past the queue?); start angle-build manually on main to build, smoke-test and release it"
            exit 1
          fi
          echo "run-id=$id" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: angle-*
          path: bundles
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish release and print digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(angle/scripts/pin.sh bundle_version)"
          commit="$(angle/scripts/pin.sh angle_commit)"
          branch="$(angle/scripts/pin.sh chromium_branch)"
          (cd bundles && sha256sum ./*.tar.xz | tee SHA256SUMS)
          # Published bundles are immutable (rebuilds are not bit-identical), so
          # never upload into an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; bump bundle_version in angle/pin.toml"
            exit 1
          fi
          # Tag the commit whose recipe built these bundles, not the default
          # branch. The default token creates it, so oxgl's bump sees
          # github-actions[bot] as its author and uploader.
          gh release create "$tag" bundles/*.tar.xz bundles/SHA256SUMS \
            --target "$GITHUB_SHA" --title "oxgl-ANGLE ${tag#angle-} ($branch)" \
            --notes "ANGLE $commit built by angle/build.sh at ${GITHUB_SHA}. Digests are in SHA256SUMS; oxgl's angle-bump workflow pins them in its angle/bundles.toml."
          {
            echo "### ANGLE bundle digests ($tag)"
            echo '```'
            cat bundles/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The App's token, created just before its one use: oxgl's bump proposes
      # this release.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot
        with:
          client-id: ${{ secrets.OXGL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OXGL_BOT_PRIVATE_KEY }}
          repositories: oxgl
          permission-contents: write
      - name: Start oxgl's bump
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api "repos/${GITHUB_REPOSITORY_OWNER}/oxgl/dispatches" -f event_type=angle-release > /dev/null

  # The one check branch protection and the merge queue require. A job may be
  # skipped only when this run did not need it; any other skip (a broken `if:`,
  # an upstream failure) fails the check.
  angle-build:
    if: always()
    needs: [changes, workflow-lint, guard, build, smoke, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT" --arg ref "$REF" '
            def ok(skippable): .result == "success" or (.result == "skipped" and skippable);
            .changes.outputs as $c
            | (.changes | ok(false)) and (.["workflow-lint"] | ok(false))
              and (.guard | ok($c.recipe == "false" or $event == "push"))
              and (.build | ok($c.build == "false"))
              and (.smoke | ok($c.build == "false"))
              and (.release | ok($ref != "refs/heads/main"
                                 or ($event == "push" and $c.recipe == "false")
                                 or ($event != "push" and $event != "workflow_dispatch")))'
