# License policy for crates in the workspace graph (see the `licensing` spec).
# Run with `cargo deny check licenses` (part of `npm run lint`).
#
# cargo-deny 0.20 checks build-dependencies along with normal ones; it has no
# option to skip them. A build-only crate whose license is not on the allowlist
# gets a per-crate entry under `exceptions`, commented
# "build-time only, not distributed".

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
allow = [
    "BSD-3-Clause",
    "BSD-2-Clause",
    "MIT",
    "ISC",
    "Zlib",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# The allowlist is policy, not an inventory of current dependencies.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are unpublished but still checked: they must be BSD-3-Clause.
ignore = false
