# The license allowlist that angle/scripts/bundle.py checks every bundled
# component against. It is a copy: oxgl's deny.toml is authoritative, and
# oxgl-sys's build.rs re-checks each pinned bundle against it, so a license
# allowed here but not there fails oxgl's build. Keep the two in step.

[licenses]
allow = [
    "BSD-3-Clause",
    "BSD-2-Clause",
    "MIT",
    "ISC",
    "Zlib",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "NCSA",
    "Spencer-94",
]
